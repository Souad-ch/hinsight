<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة الحجوزات — Hanadi Insights</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    @font-face{font-family:'DIN Next LT Arabic';src:url('fonts/DINNextLTArabic-Regular.woff2') format('woff2');font-weight:400;font-display:swap;}
    @font-face{font-family:'DIN Nums';src:url('fonts/DINNextLTArabic-Regular.woff2') format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+0030-0039,U+0660-0669,U+06F0-06F9,U+002E,U+002C,U+0025;}
    :root{--ink:#0C0B0F;--ink-mid:#101312;--ink-border:rgba(120,144,124,0.18);--gold:#78907C;--gold-bright:#9FBBA4;--cream:#DDDEDD;--cream-dim:#A8B0AC;--muted:#6B7A72;--font-ar:'DIN Nums','DIN Next LT Arabic','Noto Naskh Arabic',sans-serif;--font-mono:'DM Mono',monospace;--green:#4ade80;--red:#f87171;--radius:6px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--ink);color:var(--cream);font-family:var(--font-ar);direction:rtl;min-height:100vh;}
    a{text-decoration:none;color:inherit;}
    #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .login-box{width:100%;max-width:400px;text-align:center;background:linear-gradient(145deg,rgba(22,25,24,0.98),rgba(14,18,16,0.98));border:1px solid var(--ink-border);border-radius:12px;padding:48px 40px;}
    .login-logo{font-size:1.4rem;font-weight:700;color:var(--gold-bright);margin-bottom:6px;}
    .login-sub{font-size:0.65rem;color:var(--muted);letter-spacing:0.25em;text-transform:uppercase;margin-bottom:36px;font-family:var(--font-mono);}
    .login-input{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--ink-border);border-radius:var(--radius);padding:13px 16px;font-family:var(--font-ar);font-size:0.95rem;color:var(--cream);outline:none;margin-bottom:12px;text-align:center;}
    .login-input:focus{border-color:var(--gold);}
    .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:var(--ink);font-family:var(--font-ar);font-size:1rem;font-weight:700;border:none;border-radius:var(--radius);cursor:pointer;}
    .login-error{font-size:0.78rem;color:var(--red);margin-top:10px;display:none;}
    #dashboard{display:none;padding:32px 24px;max-width:1400px;margin:0 auto;}
    .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
    .page-title{font-size:1.5rem;font-weight:700;color:#F0F2F0;}
    .page-sub{font-size:0.8rem;color:var(--muted);font-family:var(--font-mono);}
    .header-actions{display:flex;gap:10px;align-items:center;}
    .back-link{font-size:0.82rem;color:var(--gold);border:1px solid var(--ink-border);border-radius:var(--radius);padding:8px 14px;}
    .logout-btn{font-size:0.78rem;color:var(--muted);background:none;border:1px solid var(--ink-border);border-radius:var(--radius);padding:8px 14px;cursor:pointer;font-family:var(--font-ar);}
    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:24px;}
    .stat-card{background:var(--ink-mid);border:1px solid var(--ink-border);border-radius:10px;padding:20px;text-align:center;}
    .stat-num{font-size:1.8rem;font-weight:700;color:var(--gold-bright);font-family:var(--font-mono);}
    .stat-lbl{font-size:0.7rem;color:var(--muted);margin-top:4px;}
    .filters-bar{background:var(--ink-mid);border:1px solid var(--ink-border);border-radius:10px;padding:16px;margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
    .f-input{flex:1;min-width:180px;background:rgba(255,255,255,0.03);border:1px solid var(--ink-border);border-radius:var(--radius);padding:10px 14px;font-family:var(--font-ar);font-size:0.85rem;color:var(--cream);outline:none;}
    .f-select{background:rgba(255,255,255,0.03);border:1px solid var(--ink-border);border-radius:var(--radius);padding:10px 12px;font-family:var(--font-ar);font-size:0.85rem;color:var(--cream);outline:none;cursor:pointer;}
    .export-btn{padding:10px 18px;background:rgba(120,144,124,0.12);color:var(--gold-bright);border:1px solid var(--ink-border);border-radius:var(--radius);font-family:var(--font-ar);font-size:0.82rem;cursor:pointer;}
    .table-wrap{background:var(--ink-mid);border:1px solid var(--ink-border);border-radius:10px;overflow:auto;}
    table{width:100%;border-collapse:collapse;min-width:700px;}
    th{padding:13px 16px;font-size:0.68rem;color:var(--muted);font-family:var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;text-align:right;white-space:nowrap;border-bottom:1px solid var(--ink-border);}
    td{padding:13px 16px;font-size:0.88rem;color:var(--cream-dim);border-bottom:1px solid rgba(120,144,124,0.06);vertical-align:top;}
    tbody tr:hover td{background:rgba(120,144,124,0.03);}
    tbody tr:last-child td{border-bottom:none;}
    .empty-state{text-align:center;padding:48px;color:var(--muted);font-family:var(--font-mono);font-size:0.78rem;}
    .badge{display:inline-block;font-family:var(--font-mono);font-size:0.58rem;padding:3px 10px;border-radius:20px;}
    .badge-confirmed{background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.2);color:var(--green);}
    .badge-pending{background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.2);color:#fbbf24;}
    .badge-cancelled{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);color:var(--red);}
    .status-select{background:rgba(255,255,255,0.04);border:1px solid var(--ink-border);color:var(--cream);border-radius:4px;padding:4px 6px;font-family:var(--font-ar);font-size:0.72rem;cursor:pointer;}
  </style>
</head>
<body>
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Hanadi Insights</div>
    <div class="login-sub">Bookings Dashboard</div>
    <input type="email" class="login-input" id="emailInput" placeholder="البريد الإلكتروني" dir="ltr"/>
    <input type="password" class="login-input" id="pwInput" placeholder="كلمة السر"/>
    <button class="login-btn" id="loginBtn">دخول</button>
    <div class="login-error" id="loginError">البريد أو كلمة السر غير صحيحة.</div>
  </div>
</div>
<div id="dashboard">
  <div class="page-header">
    <div><div class="page-title">📅 لوحة الحجوزات</div><div class="page-sub">جميع طلبات الاستشارة الواردة</div></div>
    <div class="header-actions">
      <a href="admin.html" class="back-link">← لوحة التحكم الرئيسية</a>
      <button class="logout-btn" id="logoutBtn">خروج</button>
    </div>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-num" id="statTotal">—</div><div class="stat-lbl">إجمالي الحجوزات</div></div>
    <div class="stat-card"><div class="stat-num" id="statConfirmed">—</div><div class="stat-lbl">مؤكدة</div></div>
    <div class="stat-card"><div class="stat-num" id="statPending">—</div><div class="stat-lbl">قيد الانتظار</div></div>
    <div class="stat-card"><div class="stat-num" id="statMonth">—</div><div class="stat-lbl">هذا الشهر</div></div>
  </div>
  <div class="filters-bar">
    <input type="text" class="f-input" id="searchInput" placeholder="🔍 بحث باسم أو إيميل..." oninput="filter()"/>
    <select class="f-select" id="statusFilter" onchange="filter()">
      <option value="">كل الحالات</option>
      <option value="confirmed">مؤكد</option>
      <option value="pending">قيد الانتظار</option>
      <option value="cancelled">ملغي</option>
    </select>
    <button class="export-btn" onclick="exportCSV()">⬇ تصدير Excel</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>العميل</th><th>الهاتف</th><th>الإيميل</th><th>نوع الجلسة</th><th>الموعد</th><th>الرسالة</th><th>الحالة</th><th>تغيير</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="8" class="empty-state">جارٍ التحميل...</td></tr></tbody>
    </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://ozxwyyeyxmpkhsygntoy.supabase.co','sb_publishable_cqwhgMNPTOYtyEeQ-NfLXA_1GSlFcaG');
let _all=[];
function showDash(){document.getElementById('loginScreen').style.display='none';document.getElementById('dashboard').style.display='block';load();}
function showLogin(){document.getElementById('loginScreen').style.display='flex';document.getElementById('dashboard').style.display='none';}
sb.auth.getSession().then(({data})=>{if(data.session)showDash();else showLogin();});
async function doLogin(){
  const e=document.getElementById('emailInput').value.trim(),p=document.getElementById('pwInput').value;
  document.getElementById('loginError').style.display='none';
  const{error}=await sb.auth.signInWithPassword({email:e,password:p});
  if(error)document.getElementById('loginError').style.display='block';else showDash();
}
document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.reload();});
async function load(){
  const{data}=await sb.from('bookings').select('*').order('created_at',{ascending:false});
  _all=data||[];
  const now=new Date(),ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  document.getElementById('statTotal').textContent=_all.length;
  document.getElementById('statConfirmed').textContent=_all.filter(b=>(b.status||'confirmed')==='confirmed').length;
  document.getElementById('statPending').textContent=_all.filter(b=>b.status==='pending').length;
  document.getElementById('statMonth').textContent=_all.filter(b=>b.created_at&&b.created_at.startsWith(ym)).length;
  render(_all);
}
function render(list){
  const tbody=document.getElementById('tbody');
  if(!list.length){tbody.innerHTML='<tr><td colspan="8" class="empty-state">لا توجد حجوزات.</td></tr>';return;}
  tbody.innerHTML=list.map(b=>{
    const st=b.status||'confirmed';
    const cls=st==='confirmed'?'badge-confirmed':st==='cancelled'?'badge-cancelled':'badge-pending';
    const lbl=st==='confirmed'?'مؤكد':st==='cancelled'?'ملغي':'انتظار';
    return `<tr>
      <td><strong>${b.client_name||'—'}</strong></td>
      <td style="font-family:var(--font-mono);font-size:0.75rem;direction:ltr;">${b.client_phone||'—'}</td>
      <td style="font-family:var(--font-mono);font-size:0.75rem;direction:ltr;">${b.client_email||'—'}</td>
      <td>${b.consultation_type||'—'}</td>
      <td style="font-family:var(--font-mono);font-size:0.75rem;white-space:nowrap;">${b.date||'—'}${b.time?' · '+b.time:''}</td>
      <td style="max-width:160px;font-size:0.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${(b.message||'').replace(/"/g,'&quot;')}">${b.message||'—'}</td>
      <td><span class="badge ${cls}">${lbl}</span></td>
      <td><select class="status-select" onchange="updateStatus('${b.id}',this.value)">
        <option value="">تغيير</option><option value="confirmed">مؤكد</option>
        <option value="pending">انتظار</option><option value="cancelled">ملغي</option>
      </select></td>
    </tr>`;
  }).join('');
}
function filter(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const st=document.getElementById('statusFilter').value;
  render(_all.filter(b=>{
    const mq=!q||(b.client_name||'').toLowerCase().includes(q)||(b.client_email||'').toLowerCase().includes(q);
    const ms=!st||(b.status||'confirmed')===st;
    return mq&&ms;
  }));
}
async function updateStatus(id,status){
  if(!status)return;
  await sb.from('bookings').update({status}).eq('id',id);
  load();
}
function exportCSV(){
  if(!_all.length)return;
  const h=['الاسم','الهاتف','الإيميل','نوع الجلسة','التاريخ','الوقت','الرسالة','الحالة','تاريخ الحجز'];
  const rows=_all.map(b=>[b.client_name||'',b.client_phone||'',b.client_email||'',b.consultation_type||'',b.date||'',b.time||'',(b.message||'').replace(/,/g,' '),b.status||'confirmed',b.created_at?new Date(b.created_at).toLocaleDateString('ar'):'']);
  const csv='﻿'+[h,...rows].map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`bookings_${new Date().toISOString().slice(0,10)}.csv`;a.click();
}
</script>
</body>
</html>

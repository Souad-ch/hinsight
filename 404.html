<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>الصفحة غير موجودة — Hanadi Insights</title>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#0C0B0F"/>
<link rel="icon" type="image/svg+xml" href="/icon.svg"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0C0B0F;color:#DDDEDD;font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background-image:radial-gradient(circle at 30% 20%,rgba(143,185,150,.07),transparent 45%),radial-gradient(circle at 75% 85%,rgba(143,185,150,.05),transparent 45%);}
  .box{text-align:center;max-width:480px}
  .logo{font-family:Georgia,serif;font-size:1.5rem;color:#9FBBA4;letter-spacing:.06em;margin-bottom:36px}
  .num{font-family:Georgia,serif;font-size:clamp(5rem,20vw,9rem);font-weight:600;line-height:1;
    background:linear-gradient(135deg,#9FBBA4,#506155);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .orn{color:#78907C;letter-spacing:8px;margin:14px 0 22px}
  h1{font-size:1.3rem;font-weight:700;color:#f3f5f1;margin-bottom:12px}
  p{color:#8a9a8c;font-size:.98rem;line-height:1.9;margin-bottom:30px}
  a.home{display:inline-block;background:transparent;border:1px solid #9FBBA4;color:#9FBBA4;text-decoration:none;font-size:.95rem;font-weight:700;padding:13px 40px;border-radius:8px;transition:.25s}
  a.home:hover{background:rgba(143,185,150,.1);transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">Hanadi Insights</div>
    <div class="num">404</div>
    <div class="orn">◆</div>
    <h1>الصفحة غير موجودة</h1>
    <p>يبدو أن الرابط الذي فتحته غير صحيح أو أن الصفحة نُقلت. لا تقلق — يمكنك العودة إلى الصفحة الرئيسية والمتابعة.</p>
    <a class="home" href="/">← العودة للرئيسية</a>
  </div>
</body>
</html>

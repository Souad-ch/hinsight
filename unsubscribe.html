<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>إلغاء الاشتراك — Hanadi Insights</title>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#0C0B0F"/>
<link rel="icon" type="image/svg+xml" href="/icon.svg"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0C0B0F;color:#DDDEDD;font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{text-align:center;max-width:460px;background:#161818;border:1px solid rgba(143,185,150,.2);border-radius:16px;padding:44px 34px}
  .logo{font-family:Georgia,serif;font-size:1.4rem;color:#9FBBA4;margin-bottom:26px}
  h1{font-size:1.2rem;color:#f3f5f1;margin-bottom:14px}
  p{color:#8a9a8c;font-size:.95rem;line-height:1.9;margin-bottom:26px}
  .em{color:#DDDEDD;direction:ltr;display:inline-block}
  button{background:transparent;border:1px solid #d98a82;color:#e0ada7;font-size:.95rem;font-weight:700;padding:12px 34px;border-radius:8px;cursor:pointer;transition:.25s;font-family:inherit}
  button:hover{background:rgba(217,138,130,.1)}
  a.home{display:inline-block;margin-top:22px;color:#9FBBA4;text-decoration:none;font-size:.9rem}
  #msg{margin-top:16px;font-size:.9rem;min-height:20px}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">Hanadi Insights</div>
    <h1>إلغاء الاشتراك بالنشرة</h1>
    <p>هل تريد إلغاء اشتراك <span class="em" id="emailDisp">—</span> من النشرة البريدية؟ لن تصلك رسائل بعد الآن.</p>
    <button id="unsubBtn" onclick="doUnsub()">نعم، ألغِ اشتراكي</button>
    <div id="msg"></div>
    <a class="home" href="/">العودة للموقع</a>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB='https://ozxwyyeyxmpkhsygntoy.supabase.co',KEY='sb_publishable_cqwhgMNPTOYtyEeQ-NfLXA_1GSlFcaG';
const email=(new URLSearchParams(location.search).get('email')||'').trim().toLowerCase();
document.getElementById('emailDisp').textContent=email||'بريدك';
if(!email){document.getElementById('unsubBtn').disabled=true;document.getElementById('msg').textContent='⚠ الرابط غير صحيح.';}
async function doUnsub(){
  const btn=document.getElementById('unsubBtn'),msg=document.getElementById('msg');
  btn.disabled=true;msg.style.color='#8a9a8c';msg.textContent='⏳ جارٍ الإلغاء...';
  try{
    const sb=supabase.createClient(SB,KEY);
    const {error}=await sb.from('newsletter_subscribers').delete().ilike('email',email);
    if(error)throw error;
    msg.style.color='#8FB996';msg.textContent='✓ تم إلغاء اشتراكك بنجاح. نأسف لرحيلك 🌿';
    btn.style.display='none';
  }catch(e){msg.style.color='#e0ada7';msg.textContent='⚠ تعذّر الإلغاء. حاول لاحقاً أو راسلنا على info@hanadiabdullah.com';btn.disabled=false;}
}
</script>
</body>
</html>
